name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        run: gradle assembleRelease --no-daemon
      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk HisenseRemote.apk
          cp chigo/build/outputs/apk/release/chigo-release.apk ChigoRemote.apk
          cp rovex/build/outputs/apk/release/rovex-release.apk RovexRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: "*.apk"
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Пульты · сборка ${{ github.run_number }}
          body: |
            RovexRemote.apk — пульт для кондиционеров Rovex (8 протоколов, автоподбор)
            ChigoRemote.apk — пульт для кондиционеров Chigo
            HisenseRemote.apk — пульт для кондиционеров Hisense
          files: |
            HisenseRemote.apk
            ChigoRemote.apk
            RovexRemote.apk
