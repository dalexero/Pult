name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HisenseRemote-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HisenseRemote.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Пульт Hisense v1.1.${{ github.run_number }}
          body: Установите HisenseRemote.apk на телефон.
          files: HisenseRemote.apk
