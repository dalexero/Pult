plugins {
    id "com.android.application"
}

android {
    namespace "app.hisense.remote"
    compileSdk 35

    defaultConfig {
        applicationId "app.hisense.remote"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подписываем отладочным ключом, чтобы APK сразу устанавливался на телефон
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
