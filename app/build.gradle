plugins {
    id "com.android.application"
}

android {
    namespace "app.hisense.remote"
    compileSdk 35

    defaultConfig {
        applicationId "app.hisense.remote"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        // Постоянный ключ: обновления ставятся поверх без удаления приложения
        release {
            storeFile rootProject.file("keystore/release.jks")
            storePassword "pultremote"
            keyAlias "pult"
            keyPassword "pultremote"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
